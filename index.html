ve permission to save. Not affiliated with Instagram.</small></main><script>const form=document.getElementById('form'),btn=document.getElementById('btn'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Downloading…';status.textContent='Video fetch ho raha hai, thoda wait karein…';try{const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('url').value.trim()})});if(!r.ok){const data=await r.json();throw Error(data.error||'Download failed')}const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='bawaal-video.mp4';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);status.textContent='✓ Download ready! iPhone par Files/Downloads check karein.'}catch(err){status.textContent='⚠ '+err.message}finally{btn.disabled=false;btn.textContent='⬇ Download Video'}})</script></body></html>
